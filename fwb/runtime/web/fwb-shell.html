<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html,body{margin:0;padding:0;border:0;width:100%;height:100%;overflow:hidden;background:#080b0b;color:#fff;font-family:system-ui,sans-serif;overscroll-behavior:none}
    body{position:fixed;inset:0;height:100dvh;touch-action:none}
    #safe-viewport{position:absolute;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;justify-content:center;overflow:hidden}
    #game-screen{position:relative;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;isolation:isolate}
    #canvas{display:block;position:relative;z-index:1;width:100%;height:100%;padding:0;border:0;background:transparent;outline:none}
    #status{position:absolute;inset:0;z-index:100;background:$GODOT_SPLASH_COLOR;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem;text-align:center}
    #status[hidden],#status-notice[hidden],#status-retry[hidden],#status-progress[hidden]{display:none}
    #status-splash{position:absolute;inset:0;max-width:100%;max-height:100%;margin:auto;pointer-events:none}
    #status-splash.show-image--false{display:none}#status-splash.fullsize--true{width:100%;height:100%;object-fit:contain}#status-splash.use-filter--false{image-rendering:pixelated}
    #status-progress,#status-notice,#status-retry{position:relative;z-index:1}#status-progress{width:60%;max-width:24rem}#status-notice{max-width:32rem;white-space:pre-wrap;padding:1rem;border-radius:.5rem;background:#202627}#status-retry{font:inherit;padding:.8rem 1.4rem;min-height:44px;cursor:pointer}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="safe-viewport"><main id="game-screen" aria-label="Game">
    <canvas id="canvas" tabindex="0">This browser does not support a game canvas.</canvas>
    <noscript>Enable JavaScript to run this game.</noscript>
    <div id="status" role="status" aria-live="polite">
      <img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
      <progress id="status-progress" aria-label="Loading"></progress>
      <div id="status-notice" hidden></div><button id="status-retry" type="button" hidden>Retry</button>
    </div>
  </main></div>
  <script src="fwb-shell.js"></script>
  <script src="fwb-media.js"></script>
  <script>
    FWBShell.boot({config:$GODOT_CONFIG,threads:$GODOT_THREADS_ENABLED,engineUrl:'$GODOT_URL',options:$FWB_SHELL_CONFIG});
  </script>
</body>
</html>
