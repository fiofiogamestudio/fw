name: workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workspace:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Git lifecycle regressions
        shell: pwsh
        run: ./tools/test-sync.ps1 -KeepFixture
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize only the pinned editor components
        run: git submodule update --init -- fwe fwa
      - name: Guarded console HTTP and command recovery contracts
        run: node --import ./fwa/tools/test-environment.js --test fwa/test/editor.test.js fwa/test/editor-command-journal.test.js
      - name: Isolated browser acceptance
        run: node tools/test-editor.mjs --output artifacts/editor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-browser-evidence
          path: artifacts/editor/
          if-no-files-found: warn
